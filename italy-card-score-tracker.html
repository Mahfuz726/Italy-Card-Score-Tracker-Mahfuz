<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Italy Card Score Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg-deep: #060610;
  --bg-card: rgba(255,255,255,0.04);
  --bg-glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --border-bright: rgba(255,255,255,0.15);

  --neon-a: #00e5ff;
  --neon-a-dim: rgba(0,229,255,0.15);
  --neon-a-glow: rgba(0,229,255,0.35);
  --neon-b: #ff4d8d;
  --neon-b-dim: rgba(255,77,141,0.15);
  --neon-b-glow: rgba(255,77,141,0.35);
  --neon-gold: #ffd700;
  --neon-green: #39ff14;
  --neon-red: #ff2d55;

  --text-primary: #f0f0ff;
  --text-secondary: rgba(240,240,255,0.55);
  --text-dim: rgba(240,240,255,0.3);

  --font-display: 'Orbitron', monospace;
  --font-body: 'Rajdhani', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius: 16px;
  --radius-sm: 8px;
  --transition: 0.2s cubic-bezier(0.23,1,0.32,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,229,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 80% 50% at 80% 110%, rgba(255,77,141,0.08) 0%, transparent 60%),
    var(--bg-deep);
  min-height: 100dvh;
}

/* ─── HEADER ─── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 12px 16px 10px;
  background: rgba(6,6,16,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.app-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--neon-a), var(--neon-b));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  flex: 1;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border-bright);
  background: var(--bg-glass);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  font-size: 16px;
  backdrop-filter: blur(10px);
}
.icon-btn:active { transform: scale(0.92); background: var(--bg-card); }
.icon-btn.danger { border-color: rgba(255,45,85,0.4); color: var(--neon-red); }

/* ─── LEADER BANNER ─── */
.leader-banner {
  margin: 12px 16px 0;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition);
}
.leader-banner .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; animation: pulse 1.5s ease-in-out infinite; }
.leader-banner.lead-a { border-color: var(--neon-a-glow); color: var(--neon-a); }
.leader-banner.lead-a .dot { background: var(--neon-a); box-shadow: 0 0 8px var(--neon-a); }
.leader-banner.lead-b { border-color: var(--neon-b-glow); color: var(--neon-b); }
.leader-banner.lead-b .dot { background: var(--neon-b); box-shadow: 0 0 8px var(--neon-b); }
.leader-banner.tied { color: var(--neon-gold); border-color: rgba(255,215,0,0.3); }
.leader-banner.tied .dot { background: var(--neon-gold); box-shadow: 0 0 8px var(--neon-gold); }

@keyframes pulse {
  0%,100% { opacity:1; transform: scale(1); }
  50% { opacity:0.6; transform: scale(0.85); }
}

/* ─── ROUND COUNTER ─── */
.round-bar {
  margin: 10px 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.round-label {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 0.06em;
}
.round-num {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--neon-gold);
  font-weight: 700;
}

/* ─── MAIN GRID ─── */
.score-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px 16px 0;
}

/* ─── TEAM PANEL ─── */
.team-panel {
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
  position: relative;
}
.team-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  transition: opacity 0.4s ease;
}
.team-panel.team-a { border-color: var(--neon-a-dim); }
.team-panel.team-a::before { background: linear-gradient(90deg, transparent, var(--neon-a), transparent); }
.team-panel.team-b { border-color: var(--neon-b-dim); }
.team-panel.team-b::before { background: linear-gradient(90deg, transparent, var(--neon-b), transparent); }
.team-panel.winning { border-color: rgba(255,215,0,0.4); box-shadow: 0 0 30px rgba(255,215,0,0.08); }
.team-panel.winning::before { background: linear-gradient(90deg, transparent, var(--neon-gold), transparent); }
.team-panel.team-a.winning { box-shadow: 0 0 30px var(--neon-a-dim); }
.team-panel.team-b.winning { box-shadow: 0 0 30px var(--neon-b-dim); }

/* Panel Header */
.panel-header {
  padding: 12px 12px 8px;
  border-bottom: 1px solid var(--border);
}

.team-name-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.team-name-input {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: transparent;
  border: none;
  outline: none;
  width: 100%;
  padding: 2px 0;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
  -webkit-text-fill-color: unset;
}
.team-a .team-name-input { color: var(--neon-a); }
.team-b .team-name-input { color: var(--neon-b); }
.team-name-input:focus { border-bottom-color: currentColor; }
.edit-icon { font-size: 10px; color: var(--text-dim); cursor: pointer; flex-shrink: 0; }

.score-display {
  text-align: center;
  padding: 6px 0 4px;
}
.score-total {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.02em;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.team-a .score-total { color: var(--neon-a); text-shadow: 0 0 20px var(--neon-a-glow); }
.team-b .score-total { color: var(--neon-b); text-shadow: 0 0 20px var(--neon-b-glow); }
.score-total.bump { animation: scoreBump 0.4s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes scoreBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.18); }
  100% { transform: scale(1); }
}

/* ─── INPUT SECTION ─── */
.panel-input {
  padding: 10px 10px 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quick-scores {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.quick-btn {
  padding: 7px 2px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-glass);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
  color: var(--text-secondary);
}
.quick-btn:active { transform: scale(0.92); }
.quick-btn.pos { color: var(--neon-green); border-color: rgba(57,255,20,0.2); }
.quick-btn.pos:active { background: rgba(57,255,20,0.12); }
.quick-btn.neg { color: var(--neon-red); border-color: rgba(255,45,85,0.2); }
.quick-btn.neg:active { background: rgba(255,45,85,0.12); }

.custom-input-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.score-input-field {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 500;
  text-align: center;
  padding: 8px 6px;
  outline: none;
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}
.score-input-field::-webkit-outer-spin-button,
.score-input-field::-webkit-inner-spin-button { -webkit-appearance: none; }
.score-input-field:focus { border-color: var(--border-bright); }
.team-a .score-input-field:focus { border-color: var(--neon-a); box-shadow: 0 0 0 2px var(--neon-a-dim); }
.team-b .score-input-field:focus { border-color: var(--neon-b); box-shadow: 0 0 0 2px var(--neon-b-dim); }

.add-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
}
.add-btn:active { transform: scale(0.9); }
.add-btn.pos-btn {
  background: rgba(57,255,20,0.12);
  border-color: rgba(57,255,20,0.4);
  color: var(--neon-green);
}
.add-btn.neg-btn {
  background: rgba(255,45,85,0.12);
  border-color: rgba(255,45,85,0.4);
  color: var(--neon-red);
}

/* ─── HISTORY LIST ─── */
.panel-history {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 300px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.panel-history::-webkit-scrollbar { width: 3px; }
.panel-history::-webkit-scrollbar-track { background: transparent; }
.panel-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.history-empty {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  padding: 16px 0;
  letter-spacing: 0.05em;
}

.history-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  animation: slideIn 0.3s cubic-bezier(0.23,1,0.32,1);
  position: relative;
  overflow: hidden;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.hist-round {
  font-size: 9px;
  color: var(--text-dim);
  min-width: 16px;
  text-align: center;
  flex-shrink: 0;
}
.hist-prev { color: var(--text-dim); }
.hist-op {
  font-weight: 600;
  flex-shrink: 0;
}
.hist-op.pos { color: var(--neon-green); }
.hist-op.neg { color: var(--neon-red); }
.hist-change {
  font-weight: 600;
  flex-shrink: 0;
}
.hist-change.pos { color: var(--neon-green); }
.hist-change.neg { color: var(--neon-red); }
.hist-eq { color: var(--text-dim); flex-shrink: 0; }
.hist-total { color: var(--text-primary); font-weight: 700; }
.hist-actions {
  margin-left: auto;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s;
  flex-shrink: 0;
}
.history-row:hover .hist-actions,
.history-row:active .hist-actions { opacity: 1; }
.hist-act-btn {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.hist-act-btn:active { transform: scale(0.88); }
.hist-act-btn.del { color: var(--neon-red); border-color: rgba(255,45,85,0.3); }
.hist-act-btn.edit { color: var(--neon-gold); border-color: rgba(255,215,0,0.3); }

/* ─── BOTTOM BAR ─── */
.bottom-bar {
  padding: 10px 16px 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
}

.action-chip {
  padding: 9px 18px;
  border-radius: 50px;
  border: 1px solid var(--border-bright);
  background: var(--bg-glass);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(10px);
}
.action-chip:active { transform: scale(0.94); background: var(--bg-card); }
.action-chip.undo { color: var(--neon-gold); border-color: rgba(255,215,0,0.3); }
.action-chip.export { color: var(--neon-a); border-color: var(--neon-a-dim); }
.action-chip.newgame { color: var(--neon-green); border-color: rgba(57,255,20,0.3); }

/* ─── MODALS ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(6,6,16,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal-sheet {
  width: 100%;
  max-width: 480px;
  background: #0f0f1e;
  border: 1px solid var(--border-bright);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px 32px;
  transform: translateY(40px);
  transition: transform 0.35s cubic-bezier(0.23,1,0.32,1);
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--border-bright);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--neon-gold);
  margin-bottom: 16px;
  text-align: center;
}
.modal-input {
  width: 100%;
  background: var(--bg-glass);
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  text-align: center;
  padding: 12px;
  outline: none;
  margin-bottom: 14px;
  -moz-appearance: textfield;
}
.modal-input::-webkit-outer-spin-button,
.modal-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.modal-btns { display: flex; gap: 10px; }
.modal-btn {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid var(--border-bright);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: var(--transition);
}
.modal-btn:active { transform: scale(0.95); }
.modal-btn.cancel { background: var(--bg-glass); color: var(--text-secondary); }
.modal-btn.confirm { background: linear-gradient(135deg, var(--neon-a), rgba(0,180,210,0.8)); color: #000; border-color: transparent; }

/* ─── CELEBRATION ─── */
.celebration {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 300;
  overflow: hidden;
  display: none;
}
.celebration.active { display: block; }
.confetti-piece {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  top: -20px;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ─── TOAST ─── */
.toast-container {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  padding: 10px 20px;
  border-radius: 50px;
  background: rgba(15,15,30,0.95);
  border: 1px solid var(--border-bright);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
  backdrop-filter: blur(20px);
}
.toast.out { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn {
  from { opacity:0; transform: translateY(-10px) scale(0.9); }
  to { opacity:1; transform: translateY(0) scale(1); }
}
@keyframes toastOut {
  from { opacity:1; transform: translateY(0) scale(1); }
  to { opacity:0; transform: translateY(-10px) scale(0.9); }
}

/* ─── RESET CONFIRM ─── */
.confirm-modal {
  position: fixed;
  inset: 0;
  background: rgba(6,6,16,0.9);
  backdrop-filter: blur(12px);
  z-index: 400;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.confirm-modal.open { opacity: 1; pointer-events: all; }
.confirm-box {
  background: #0f0f1e;
  border: 1px solid var(--border-bright);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 320px;
  width: 100%;
  transform: scale(0.9);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  text-align: center;
}
.confirm-modal.open .confirm-box { transform: scale(1); }
.confirm-icon { font-size: 36px; margin-bottom: 12px; }
.confirm-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--neon-red);
  margin-bottom: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.confirm-msg { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
}
.confirm-btn:active { transform: scale(0.95); }
.confirm-btn.cancel-btn { background: var(--bg-glass); color: var(--text-secondary); }
.confirm-btn.reset-btn { background: rgba(255,45,85,0.15); border-color: rgba(255,45,85,0.5); color: var(--neon-red); }

/* ─── EDIT INLINE ─── */
.hist-edit-input {
  font-family: var(--font-mono);
  font-size: 11px;
  width: 48px;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--neon-gold);
  border-radius: 4px;
  color: var(--neon-gold);
  text-align: center;
  padding: 2px 4px;
  outline: none;
  -moz-appearance: textfield;
}
.hist-edit-input::-webkit-outer-spin-button,
.hist-edit-input::-webkit-inner-spin-button { -webkit-appearance: none; }

/* ─── SCREENSHOT AREA ─── */
#screenshot-area {
  position: fixed;
  top: -9999px;
  left: -9999px;
  width: 400px;
  background: var(--bg-deep);
  padding: 20px;
  font-family: var(--font-body);
  color: var(--text-primary);
}

/* Scrollbar iOS fix */
.panel-history { -webkit-overflow-scrolling: touch; }

@media (max-width: 360px) {
  .score-total { font-size: 30px; }
  .quick-scores { grid-template-columns: repeat(3, 1fr); }
  .hist-round { display: none; }
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>
<div class="celebration" id="celebration"></div>

<!-- HEADER -->
<header class="app-header">
  <div class="app-title">🃏 Italy Cards</div>
  <div class="header-actions">
    <button class="icon-btn" id="undoBtn" title="Undo last move">↩</button>
    <button class="icon-btn danger" id="resetBtn" title="Reset match">⚡</button>
  </div>
</header>

<!-- LEADER BANNER -->
<div class="leader-banner tied" id="leaderBanner">
  <div class="dot"></div>
  <span id="leaderText">Tie Game — Let's play!</span>
</div>

<!-- ROUND BAR -->
<div class="round-bar">
  <span class="round-label">ROUND</span>
  <span class="round-num" id="roundNum">—</span>
</div>

<!-- MAIN SCORE GRID -->
<div class="score-grid">

  <!-- TEAM A -->
  <div class="team-panel team-a" id="panelA">
    <div class="panel-header">
      <div class="team-name-wrap">
        <input class="team-name-input" id="nameA" value="TEAM A" maxlength="8" spellcheck="false">
        <span class="edit-icon">✏</span>
      </div>
      <div class="score-display">
        <div class="score-total" id="totalA">0</div>
      </div>
    </div>
    <div class="panel-input">
      <div class="quick-scores" id="quickA"></div>
      <div class="custom-input-row">
        <input type="number" class="score-input-field" id="inputA" placeholder="…" inputmode="numeric">
        <button class="add-btn pos-btn" id="addPosA">+</button>
        <button class="add-btn neg-btn" id="addNegA">−</button>
      </div>
    </div>
    <div class="panel-history" id="historyA">
      <div class="history-empty">No entries yet</div>
    </div>
  </div>

  <!-- TEAM B -->
  <div class="team-panel team-b" id="panelB">
    <div class="panel-header">
      <div class="team-name-wrap">
        <input class="team-name-input" id="nameB" value="TEAM B" maxlength="8" spellcheck="false">
        <span class="edit-icon">✏</span>
      </div>
      <div class="score-display">
        <div class="score-total" id="totalB">0</div>
      </div>
    </div>
    <div class="panel-input">
      <div class="quick-scores" id="quickB"></div>
      <div class="custom-input-row">
        <input type="number" class="score-input-field" id="inputB" placeholder="…" inputmode="numeric">
        <button class="add-btn pos-btn" id="addPosB">+</button>
        <button class="add-btn neg-btn" id="addNegB">−</button>
      </div>
    </div>
    <div class="panel-history" id="historyB">
      <div class="history-empty">No entries yet</div>
    </div>
  </div>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="action-chip export" id="exportBtn">📷 Screenshot</button>
  <button class="action-chip newgame" id="newGameBtn">🎮 New Game</button>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Edit Score Entry</div>
    <input type="number" class="modal-input" id="editModalInput" inputmode="numeric">
    <div class="modal-btns">
      <button class="modal-btn cancel" id="editCancelBtn">Cancel</button>
      <button class="modal-btn confirm" id="editConfirmBtn">Save</button>
    </div>
  </div>
</div>

<!-- RESET CONFIRM -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title">Reset Match?</div>
    <div class="confirm-msg">All scores will be cleared. This cannot be undone.</div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel-btn" id="confirmCancelBtn">Cancel</button>
      <button class="confirm-btn reset-btn" id="confirmResetBtn">Reset</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────
const QUICK_VALUES = [5, 7, 8, 9];

let state = {
  teamA: { name: 'TEAM A', history: [] },
  teamB: { name: 'TEAM B', history: [] },
  round: 0,
  undoStack: []
};

function getTotal(team) {
  return team.history.reduce((s, e) => s + e.change, 0);
}

function getRound() {
  const maxLen = Math.max(state.teamA.history.length, state.teamB.history.length);
  return maxLen;
}

// ─── PERSISTENCE ─────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem('italyCardState', JSON.stringify(state)); } catch(e){}
}

function load() {
  try {
    const raw = localStorage.getItem('italyCardState');
    if (raw) { state = JSON.parse(raw); }
  } catch(e) {}
}

// ─── AUDIO ───────────────────────────────────────────────────────────
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'pos') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    } else if (type === 'neg') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } else if (type === 'undo') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(500, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e){}
}

// ─── CELEBRATION ─────────────────────────────────────────────────────
function celebrate() {
  const el = document.getElementById('celebration');
  el.innerHTML = '';
  el.classList.add('active');
  const colors = ['#00e5ff','#ff4d8d','#ffd700','#39ff14','#a855f7'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.5}s;
    `;
    el.appendChild(p);
  }
  setTimeout(() => { el.classList.remove('active'); el.innerHTML=''; }, 3000);
}

// ─── TOAST ───────────────────────────────────────────────────────────
function toast(msg) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

// ─── SCORE LOGIC ─────────────────────────────────────────────────────
function addScore(team, change) {
  if (!change || isNaN(change)) return;
  const prevTotal = getTotal(state[team]);
  const entry = {
    id: Date.now() + Math.random(),
    round: getRound() + 1,
    prevTotal,
    change,
    total: prevTotal + change
  };

  // push undo snapshot
  state.undoStack.push({
    team,
    entry: JSON.parse(JSON.stringify(entry)),
    action: 'add'
  });
  if (state.undoStack.length > 50) state.undoStack.shift();

  state[team].history.push(entry);
  save();
  render();
  playSound(change > 0 ? 'pos' : 'neg');

  // bump animation
  const totalEl = document.getElementById(team === 'teamA' ? 'totalA' : 'totalB');
  totalEl.classList.remove('bump');
  void totalEl.offsetWidth;
  totalEl.classList.add('bump');
}

function deleteEntry(team, id) {
  const idx = state[team].history.findIndex(e => e.id === id);
  if (idx === -1) return;

  // store undo
  state.undoStack.push({
    team, action: 'delete', idx,
    entry: JSON.parse(JSON.stringify(state[team].history[idx]))
  });

  state[team].history.splice(idx, 1);
  // Recalculate running totals
  recalcTotals(team);
  save();
  render();
  toast('Entry deleted');
}

function editEntry(team, id, newChange) {
  const entry = state[team].history.find(e => e.id === id);
  if (!entry) return;
  state.undoStack.push({ team, action: 'edit', id, oldChange: entry.change });
  entry.change = newChange;
  recalcTotals(team);
  save();
  render();
  toast('Entry updated');
}

function recalcTotals(team) {
  let running = 0;
  state[team].history.forEach(e => {
    e.prevTotal = running;
    running += e.change;
    e.total = running;
  });
}

function undo() {
  if (!state.undoStack.length) { toast('Nothing to undo'); return; }
  const op = state.undoStack.pop();
  if (op.action === 'add') {
    const idx = state[op.team].history.findIndex(e => e.id === op.entry.id);
    if (idx !== -1) state[op.team].history.splice(idx, 1);
    recalcTotals(op.team);
  } else if (op.action === 'delete') {
    state[op.team].history.splice(op.idx, 0, op.entry);
    recalcTotals(op.team);
  } else if (op.action === 'edit') {
    const e = state[op.team].history.find(x => x.id === op.id);
    if (e) { e.change = op.oldChange; recalcTotals(op.team); }
  }
  save();
  render();
  playSound('undo');
  toast('↩ Undone');
}

function resetMatch() {
  state.teamA.history = [];
  state.teamB.history = [];
  state.undoStack = [];
  save();
  render();
  toast('Match reset!');
}

// ─── RENDER ──────────────────────────────────────────────────────────
function render() {
  const totA = getTotal(state.teamA);
  const totB = getTotal(state.teamB);
  const roundNum = getRound();

  // Totals
  document.getElementById('totalA').textContent = totA >= 0 ? '+' + totA : totA;
  document.getElementById('totalB').textContent = totB >= 0 ? '+' + totB : totB;

  // Round
  document.getElementById('roundNum').textContent = roundNum > 0 ? '#' + roundNum : '—';

  // Leader banner
  const banner = document.getElementById('leaderBanner');
  const bannerText = document.getElementById('leaderText');
  const nameA = state.teamA.name;
  const nameB = state.teamB.name;
  banner.className = 'leader-banner';
  if (totA > totB) {
    banner.classList.add('lead-a');
    bannerText.textContent = nameA + ' is leading by ' + (totA - totB);
  } else if (totB > totA) {
    banner.classList.add('lead-b');
    bannerText.textContent = nameB + ' is leading by ' + (totB - totA);
  } else {
    banner.classList.add('tied');
    bannerText.textContent = 'Tie Game — Let\'s play!';
  }

  // Winning highlight
  const panelA = document.getElementById('panelA');
  const panelB = document.getElementById('panelB');
  panelA.classList.remove('winning');
  panelB.classList.remove('winning');
  if (roundNum > 0) {
    if (totA > totB) panelA.classList.add('winning');
    else if (totB > totA) panelB.classList.add('winning');
  }

  // Names
  document.getElementById('nameA').value = state.teamA.name;
  document.getElementById('nameB').value = state.teamB.name;

  // Histories
  renderHistory('teamA', 'historyA');
  renderHistory('teamB', 'historyB');
}

function renderHistory(team, elId) {
  const el = document.getElementById(elId);
  const hist = state[team].history;
  if (!hist.length) {
    el.innerHTML = '<div class="history-empty">No entries yet</div>';
    return;
  }
  el.innerHTML = '';
  // Show newest first
  const reversed = [...hist].reverse();
  reversed.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'history-row';
    row.dataset.id = entry.id;

    const isPos = entry.change >= 0;
    const absChange = Math.abs(entry.change);
    const op = isPos ? '+' : '−';
    const opClass = isPos ? 'pos' : 'neg';

    row.innerHTML = `
      <span class="hist-round">${entry.round}</span>
      <span class="hist-prev">${entry.prevTotal >= 0 ? '+'+entry.prevTotal : entry.prevTotal}</span>
      <span class="hist-op ${opClass}">${op}</span>
      <span class="hist-change ${opClass}">${absChange}</span>
      <span class="hist-eq">=</span>
      <span class="hist-total">${entry.total >= 0 ? '+'+entry.total : entry.total}</span>
      <div class="hist-actions">
        <button class="hist-act-btn edit" data-id="${entry.id}" data-team="${team}" title="Edit">✎</button>
        <button class="hist-act-btn del" data-id="${entry.id}" data-team="${team}" title="Delete">✕</button>
      </div>
    `;
    el.appendChild(row);
  });

  // Touch-friendly long-press for history actions (show on tap for mobile)
  el.querySelectorAll('.history-row').forEach(row => {
    row.addEventListener('click', () => {
      row.querySelector('.hist-actions').style.opacity = '1';
    });
  });
}

// ─── QUICK BUTTONS ───────────────────────────────────────────────────
function buildQuickBtns(containerId, team) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  QUICK_VALUES.forEach(v => {
    const pos = document.createElement('button');
    pos.className = 'quick-btn pos';
    pos.textContent = '+' + v;
    pos.addEventListener('click', () => addScore(team, v));
    c.appendChild(pos);
  });
  QUICK_VALUES.slice(0,4).forEach(v => {
    const neg = document.createElement('button');
    neg.className = 'quick-btn neg';
    neg.textContent = '−' + v;
    neg.addEventListener('click', () => addScore(team, -v));
    c.appendChild(neg);
  });
}

// ─── EDIT MODAL ───────────────────────────────────────────────────────
let editTarget = null;

function openEditModal(team, id, currentChange) {
  editTarget = { team, id };
  const modal = document.getElementById('editModal');
  const input = document.getElementById('editModalInput');
  input.value = currentChange;
  modal.classList.add('open');
  setTimeout(() => input.focus(), 350);
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editTarget = null;
}

// ─── EXPORT SCREENSHOT ───────────────────────────────────────────────
function exportScreenshot() {
  // Build a simple text snapshot
  const totA = getTotal(state.teamA);
  const totB = getTotal(state.teamB);
  const nameA = state.teamA.name;
  const nameB = state.teamB.name;
  const round = getRound();

  let text = `🃏 ITALY CARD SCORE TRACKER\n`;
  text += `Round #${round}\n\n`;
  text += `${nameA}: ${totA >= 0 ? '+'+totA : totA}\n`;
  state.teamA.history.slice().reverse().forEach(e => {
    const op = e.change >= 0 ? '+' : '−';
    const abs = Math.abs(e.change);
    text += `  R${e.round}: ${e.prevTotal >= 0 ? '+'+e.prevTotal : e.prevTotal} ${op}${abs} = ${e.total >= 0 ? '+'+e.total : e.total}\n`;
  });
  text += `\n${nameB}: ${totB >= 0 ? '+'+totB : totB}\n`;
  state.teamB.history.slice().reverse().forEach(e => {
    const op = e.change >= 0 ? '+' : '−';
    const abs = Math.abs(e.change);
    text += `  R${e.round}: ${e.prevTotal >= 0 ? '+'+e.prevTotal : e.prevTotal} ${op}${abs} = ${e.total >= 0 ? '+'+e.total : e.total}\n`;
  });
  text += `\n— Exported from Italy Card Score Tracker`;

  if (navigator.share) {
    navigator.share({ title: 'Italy Card Scores', text }).catch(() => {});
  } else {
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'italy-card-scores.txt';
    a.click();
    URL.revokeObjectURL(url);
    toast('Score exported!');
  }
}

// ─── EVENT LISTENERS ──────────────────────────────────────────────────
function init() {
  load();

  buildQuickBtns('quickA', 'teamA');
  buildQuickBtns('quickB', 'teamB');

  // Add score buttons
  document.getElementById('addPosA').addEventListener('click', () => {
    const v = parseInt(document.getElementById('inputA').value);
    if (v && v > 0) { addScore('teamA', v); document.getElementById('inputA').value = ''; }
    else toast('Enter a positive number');
  });
  document.getElementById('addNegA').addEventListener('click', () => {
    const v = parseInt(document.getElementById('inputA').value);
    if (v && v > 0) { addScore('teamA', -v); document.getElementById('inputA').value = ''; }
    else toast('Enter a positive number');
  });
  document.getElementById('addPosB').addEventListener('click', () => {
    const v = parseInt(document.getElementById('inputB').value);
    if (v && v > 0) { addScore('teamB', v); document.getElementById('inputB').value = ''; }
    else toast('Enter a positive number');
  });
  document.getElementById('addNegB').addEventListener('click', () => {
    const v = parseInt(document.getElementById('inputB').value);
    if (v && v > 0) { addScore('teamB', -v); document.getElementById('inputB').value = ''; }
    else toast('Enter a positive number');
  });

  // Enter key on inputs
  ['inputA','inputB'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const isA = id === 'inputA';
        document.getElementById(isA ? 'addPosA' : 'addPosB').click();
      }
    });
  });

  // Team names
  document.getElementById('nameA').addEventListener('change', e => {
    state.teamA.name = e.target.value.toUpperCase() || 'TEAM A';
    save(); render();
  });
  document.getElementById('nameB').addEventListener('change', e => {
    state.teamB.name = e.target.value.toUpperCase() || 'TEAM B';
    save(); render();
  });

  // History actions
  document.getElementById('historyA').addEventListener('click', e => {
    const btn = e.target.closest('.hist-act-btn');
    if (!btn) return;
    const id = parseFloat(btn.dataset.id);
    const team = btn.dataset.team;
    if (btn.classList.contains('del')) {
      deleteEntry(team, id);
    } else if (btn.classList.contains('edit')) {
      const entry = state[team].history.find(x => x.id === id);
      if (entry) openEditModal(team, id, entry.change);
    }
  });
  document.getElementById('historyB').addEventListener('click', e => {
    const btn = e.target.closest('.hist-act-btn');
    if (!btn) return;
    const id = parseFloat(btn.dataset.id);
    const team = btn.dataset.team;
    if (btn.classList.contains('del')) {
      deleteEntry(team, id);
    } else if (btn.classList.contains('edit')) {
      const entry = state[team].history.find(x => x.id === id);
      if (entry) openEditModal(team, id, entry.change);
    }
  });

  // Edit modal
  document.getElementById('editConfirmBtn').addEventListener('click', () => {
    if (!editTarget) return;
    const val = parseInt(document.getElementById('editModalInput').value);
    if (isNaN(val)) { toast('Enter a valid number'); return; }
    editEntry(editTarget.team, editTarget.id, val);
    closeEditModal();
  });
  document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
  document.getElementById('editModal').addEventListener('click', e => {
    if (e.target === document.getElementById('editModal')) closeEditModal();
  });
  document.getElementById('editModalInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('editConfirmBtn').click();
  });

  // Undo
  document.getElementById('undoBtn').addEventListener('click', undo);

  // Reset
  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('confirmModal').classList.add('open');
  });
  document.getElementById('confirmCancelBtn').addEventListener('click', () => {
    document.getElementById('confirmModal').classList.remove('open');
  });
  document.getElementById('confirmResetBtn').addEventListener('click', () => {
    document.getElementById('confirmModal').classList.remove('open');
    resetMatch();
  });
  document.getElementById('confirmModal').addEventListener('click', e => {
    if (e.target === document.getElementById('confirmModal'))
      document.getElementById('confirmModal').classList.remove('open');
  });

  // Export
  document.getElementById('exportBtn').addEventListener('click', exportScreenshot);

  // New Game
  document.getElementById('newGameBtn').addEventListener('click', () => {
    document.getElementById('confirmModal').classList.add('open');
  });

  // Celebration when someone reaches 61+
  let prevLeader = null;
  setInterval(() => {
    const totA = getTotal(state.teamA);
    const totB = getTotal(state.teamB);
    const leader = totA > totB ? 'A' : totB > totA ? 'B' : null;
    if (leader && leader !== prevLeader && Math.max(totA,totB) >= 61) {
      celebrate();
    }
    prevLeader = leader;
  }, 500);

  render();
}

init();
</script>
</body>
</html>
